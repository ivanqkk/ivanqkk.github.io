# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" 
title                    : "Ivan Cucchi"
title_separator          : "–"
name                     : &name "Ivan Cucchi"
description              : &description "Ivan Cucchi, Application Specialist in AI for Life Science at Stockholm University and Sweden AI Factory: machine learning for proteins, molecules and biomedical data."
url                      : "https://ivanqkk.github.io"
baseurl                  : "" 
repository               : "ivanqkk/ivanqkk.github.io"

# Site Author - Controls the automated sidebar links and metadata structures
author:
  # Biographic information
  avatar           : "me.jpeg"
  name             : "Ivan Cucchi"
  pronouns         : 
  bio              : "Application Specialist in AI for Life Science at Stockholm University (SciLifeLab) | Sweden AI Factory"  
  location         : "Stockholm, Sweden"
  employer         : "Stockholm University"
  uri              : 
  email            : "ivanqkk92@naiss.se"

  # Academic websites
  academia         : 
  arxiv            : 
  googlescholar    : "https://scholar.google.com/citations?user=McUStm0AAAAJ"
  inspire-hep      : 
  impactstory      : 
  orcid            : "https://orcid.org/0009-0007-8832-6820"
  semantic         : 
  ssrn             : 
  pubmed           : 
  researchgate     : "https://www.researchgate.net/profile/Ivan-Cucchi"

  # Repositories and software development
  bitbucket        : 
  codepen          : 
  dribbble         : 
  github           : "ivanqkk"
  kaggle           :   
  stackoverflow    : 

  # Social media
  linkedin         : "ivan-cucchi-298758193"
  twitter          : 

# Site Settings
og_image                 : "og-image.png"   # 1200x630 social preview card in /images/

# Author name variants to bold in rendered author lists (publication cards)
author_aliases           : ["I. Cucchi", "Ivan Cucchi"]
future                   : true
read_more                : "disabled" 

# Atom feed - hidden: this site has no blog, so there is nothing to syndicate
atom_feed:
  hide                   : true

# Analytics - disabled: no visitor tracking, so no cookies and no consent banner needed
analytics:
  provider               : false

# Reading Files
include:
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - CHANGELOG
  - Gemfile
  - LICENSE
  - README
  - README.md
  - Dockerfile
  - docker-compose.yaml
  - package.json
  - node_modules
  - package-lock.json
  - scripts
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion settings
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections configuration for structural pages
collections:
  # Course detail pages are not linked from anywhere: teaching.html renders every
  # course inline and links out to the university catalogue. Kept as data only.
  teaching:
    output: false
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Markdown default values injection rules
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: archive
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
      author_profile: true
      share: true
      scripts: [cite]
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS configuration
sass:
  sass_dir: _sass
  style: compressed 

permalink: /:categories/:title/
timezone: Europe/Stockholm  # event times in _data/events.yml are shown in Stockholm time

# Core Template Plugins
plugins:
  - jekyll-sitemap

compress_html:
  clippings: all
  ignore:
    envs: development