# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" 
title                    : "Ivan Cucchi"
title_separator          : "–"
name                     : &name "Ivan Cucchi"
description              : &description "Personal website of Ivan Cucchi – Application Specialist in AI for Life Sciences"
url                      : "https://ivanqkk.github.io"
baseurl                  : "" 
repository               : "ivanqkk.github.io"

# Site Author - Controls the automated sidebar links and metadata structures
author:
  # Biographic information
  avatar           : "me.jpeg"
  name             : "Ivan Cucchi"
  pronouns         : 
  bio              : "Application Specialist in AI for Life Sciences at Stockholm University (SciLifeLab) | MIMER AI Factory"
  location         : "Stockholm, Sweden"
  employer         : "Stockholm University & SciLifeLab"
  uri              : 
  email            : "ivanqkk92@naiss.se"

  # Academic websites
  academia         : 
  arxiv            : 
  googlescholar    : "https://scholar.google.com/citations?view_op=list_works&hl=it&user=McUStm0AAAAJ"
  inspire-hep      : 
  impactstory      : 
  orcid            : "https://orcid.org/0009-0007-8832-6820"
  semantic         : 
  ssrn             : 
  pubmed           : 
  researchgate     : "https://www.researchgate.net/profile/Ivan-Cucchi"

  # Repositories and software development
  bitbucket        : 
  codepen          : 
  dribbble         : 
  github           : "ivanqkk"
  kaggle           :   
  stackoverflow    : 

  # Social media
  linkedin         : "ivan-cucchi-298758193"
  twitter          : 

# Publication Category - Used to organize layout structures
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'    
  conferences:
    title: 'Conference Papers'
  theses:
    title: 'Theses'

# Site Settings
teaser                   :  
breadcrumbs              : false 
words_per_minute         : 200
future                   : true
read_more                : "disabled" 
talkmap_link             : true # Enabled to activate automated mapping or summary lists if supported by the layout

comments:
  provider               : false

# Analytics - Google Analytics 4 integration tracking active traffic
analytics:
  provider               : "google-analytics-4"
  google:
    tracking_id          : "G-8LBVNLFBNN"

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - CHANGELOG
  - Gemfile
  - LICENSE
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion settings
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections configuration for structural pages
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Markdown default values injection rules
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS configuration
sass:
  sass_dir: _sass
  style: compressed 

permalink: /:categories/:title/
timezone: Etc/UTC 

# Core Template Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development