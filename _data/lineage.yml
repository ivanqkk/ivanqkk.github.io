  short: Avicenna
  place: Bukhara
  year: 1000
  year_label: around the year 1000
  dial: c. 1000
  fact: Philosopher and physician. His Canon of Medicine was a standard textbook in European universities for centuries. A thousand years later, one of his academic descendants trains machine learning models on medical data.
  mgp_id: 298616
  star: true
sides:
- at: 0
  title: My second advisor
  teaser: Giorgio Colombo, computational chemist, who co-supervised my PhD.
  people:
  - g: 1
    label: Co-advisor
    name: Giorgio Colombo
    deg: PhD
    school: University of Milan
    place: Milan
    year: 2000
    thesis: 'Structure, reactivity and activity of proteases: computational studies'
    fact: Professor of organic chemistry in Pavia, who uses molecular dynamics to understand how proteins move and bind, and to design molecules that change it. As a postdoc in Groningen he worked with Herman Berendsen, one of the creators of GROMACS. 
- at: 14
  title: Leibniz’s teacher in Paris
  teaser: Christiaan Huygens, then four Dutch generations back to the man who spent his life computing π.
  people:
  - g: 15
    name: Christiaan Huygens
    short: Huygens
    deg: Artium Liberalium Magister
    school: Leiden University
    place: Leiden
    year: 1647
    fact: Built the first pendulum clock, proposed the wave theory of light and discovered Titan, Saturn’s largest moon. The database lists him as Leibniz’s teacher during his years in Paris.
    mgp_id: 125561
    star: true
  - g: 16
    name: Frans van Schooten Jr.
    deg: Artium Liberalium Magister
    school: Leiden University
    place: Leiden
    year: 1635
    fact: Translated Descartes’ Géométrie into Latin, which is how much of Europe learned analytic geometry. His second teacher was Marin Mersenne, of the Mersenne primes.
    mgp_id: 125450
  - g: 17
    name: Jacobus Golius
    deg: Magister and PhD
    school: Leiden University
    place: Leiden
    year: 1612
    year_label: 1612 and 1621
    fact: 'Orientalist and mathematician. Among his other students: René Descartes.'
    mgp_id: 125408
  - g: 18
    name: Willebrord Snellius
    deg: Artium Liberalium Magister
    school: Leiden University
    place: Leiden
    year: 1607
    fact: Snell’s law of refraction carries his name, and he pioneered measuring the Earth by triangulation.
    mgp_id: 125302
  - g: 19
    name: Ludolph van Ceulen
    place: Leiden
    year: 1590
    year_label: late 16th century
    dial: c. 1590
    fact: A fencing master who spent much of his life computing π, reaching 35 decimal places. The digits were engraved on his tombstone, and in German π was long called the Ludolphine number.
    mgp_id: 125232
- at: 21
  title: Novara had a second teacher
  teaser: 'Luca Pacioli: father of double-entry bookkeeping and friend of Leonardo da Vinci.'
  people:
  - g: 22
    name: Luca Pacioli
    short: Pacioli
    deg: No degree recorded
    place: Italy
    year: 1480
    year_label: active from the 1470s
    dial: c. 1480
    fact: The father of double-entry bookkeeping, and a friend of Leonardo da Vinci, who drew the polyhedra for his book on the divine proportion. His own teacher is unknown, so this branch stops here, in Italy, where the line began.
    mgp_id: 126888
    star: true
- at: 22
  title: Regiomontanus’s first teacher
  teaser: Georg von Peuerbach, and through Vienna and Paris back to Nicole Oresme, who was drawing graphs in the 1300s.
  people:
  - g: 23
    name: Georg von Peuerbach
    deg: Magister artium
    school: University of Vienna
    place: Vienna
    year: 1440
    fact: His textbook on the motions of the planets was the standard introduction to astronomy for well over a century.
    mgp_id: 126087
  - g: 24
    name: Johannes von Gmunden
    deg: Magister artium
    school: University of Vienna
    place: Vienna
    year: 1406
    fact: One of the founders of the Vienna school of mathematical astronomy.
    mgp_id: 126887
  - g: 25
    name: Heinrich von Langenstein
    deg: Magister artium
    school: University of Paris
    place: Paris
    year: 1363
    fact: Moved from Paris to Vienna, where he helped build up the young university.
    mgp_id: 127264
  - g: 26
    name: Nicole Oresme
    short: Oresme
    school: University of Paris
    place: Paris
    year: 1350
    year_label: mid-14th century
    dial: c. 1350
    fact: Drew quantities as graphs three centuries before Descartes, proved that the harmonic series diverges, and argued that the Earth might rotate. Later Bishop of Lisieux.
    star: true
- at: 33
  title: Ibn Yunus’s other teacher
  teaser: Sharaf al-Din al-Tusi, who studied cubic equations with something very close to a derivative.
  people:
  - g: 34
    name: Sharaf al-Din al-Tusi
    place: Mosul
    year: 1170
    year_label: 12th century
    dial: c. 1170
    fact: His treatise on equations works out when a cubic has positive roots, using an idea remarkably close to the derivative. He also invented the linear astrolabe, the “staff of al-Tusi”.
    mgp_id: 230926
relatives:
