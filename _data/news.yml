# Recent news shown as a timeline on the home page (_pages/about.md,
# _includes/news-timeline.html).
#
# Newest first — items are rendered in the order written here.
#
# Fields per item:
#   date  (required) short label shown on the timeline, e.g. "Sep 2026"
#   dt    (required) the same date in ISO form for <time datetime>, e.g. 2026-09
#   text  (required) one sentence; plain text
#   tag   (optional) pill next to the date, e.g. "Milestone", "Paper", "Talk"
#   url   (optional) makes the text a link. Site-relative paths start with "/"
#         ("/publications/"); anything containing "://" is treated as external
#         and opens in a new tab.

