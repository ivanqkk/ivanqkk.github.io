# Workshops and courses: "Upcoming events" on the home page and the Talks
# page (_pages/talks.html). Once an event has ended it moves among the talk
# cards of its year. Jekyll splits upcoming / past at build time;
# assets/js/events.js redoes it in the visitor's browser, adds the countdown
# and the registration-deadline note. Without JavaScript every card still
# shows its date.
#
# Fields per item:
#   id            (required) short unique id
#   title, kind   (required) e.g. kind "Workshop", "Course"
#   format        (required) e.g. "Online", "Online, free" — shown as the location
#   org           (required) organiser(s)
#   start, end    (required) ISO date-time with offset, e.g. 2026-10-23T09:00:00+02:00
#   register_by   (optional) end of registration, same format
#   role          (optional) my role, shown while upcoming
#   past_role     (optional) short role shown on the card once it is past
#   summary, audience (optional)
#   url           (required) event page
#   register_url  (optional) registration form; hidden once registration closes
#   logo          (optional) image in /images/ for the past card watermark

