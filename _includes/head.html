{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

{% if site.atom_feed.hide != true %}
  <link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">
{% endif %}

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  /* Set the theme before first paint: the saved choice, else the system one.
     assets/js/theme-toggle.js takes over from here. Without JavaScript the
     CSS follows the system preference on its own.
     Block comments only: compress_html joins lines. */
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    var sys = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', (saved === 'dark' || saved === 'light') ? saved : sys);
  })();
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
